spring.application.name=UberProject-AuthService
# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/Uber_DB_Local
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Spring Data JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
#other value for ddl-auto are : create, create-drop, none
spring.jpa.show-sql=true
# Adjust for MySQL version
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#Server Config
server.port=7475

# Spring Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:mysql://localhost:3306/Uber_DB_Local
spring.flyway.user=root
spring.flyway.password=0000